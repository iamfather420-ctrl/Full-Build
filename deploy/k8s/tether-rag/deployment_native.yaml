apiVersion: apps/v1
kind: Deployment
metadata:
  name: tether-rag
  namespace: daisy-prod
  labels:
    app: tether-rag
    tier: data-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tether-rag
  template:
    metadata:
      labels:
        app: tether-rag
    spec:
      containers:
        - name: tether-rag
          image: ghcr.io/solvex/tether-rag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: VECTOR_DB_PATH
              value: "/data/vector_db"
            - name: TETHER_STRICT_LOCAL
              value: "true"
          volumeMounts:
            - name: rag-persistent-storage
              mountPath: /data
      volumes:
        - name: rag-persistent-storage
          persistentVolumeClaim:
            claimName: rag-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tether-rag
  namespace: daisy-prod
  labels:
    app: tether-rag
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: tether-rag
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tether-rag-hpa
  namespace: daisy-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tether-rag
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: customize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
images:
  - name: tether-rag
    newName: ghcr.io/solvex/tether-rag
    newTag: latest
