name: Read-only GATE-11 Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/neon-gate11-role-and-rls-audit-20261020

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "PG18_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"

      - name: Run read-only GATE-11 audit
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::NEON_DATABASE_URL is unavailable"
            exit 1
          fi
          PSQL="${PG18_BIN}/psql"
          echo "Running read-only audit..."
          "$PSQL" "$NEON_DATABASE_URL" -f scripts/neon-gate11-readonly-audit.sql -o /tmp/audit-output.txt
          cat /tmp/audit-output.txt
          echo "AUDIT_OUTPUT<<EOF" >> "$GITHUB_ENV"
          cat /tmp/audit-output.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: gate11-readonly-audit-${{ github.run_id }}
          path: /tmp/audit-output.txt
          retention-days: 7
