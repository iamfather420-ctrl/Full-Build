name: Daisy Creative Integrity Tests

on:
  pull_request:
    paths:
      - "src/creative/**"
      - "package.json"
      - ".github/workflows/daisy-creative-integrity.yml"
  push:
    branches:
      - feat/daisy-creative-integrity-protocol
    paths:
      - "src/creative/**"
      - "package.json"
      - ".github/workflows/daisy-creative-integrity.yml"

permissions:
  contents: read

jobs:
  creative-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Run Daisy Creative Integrity tests
        run: bun run test:creative-integrity
