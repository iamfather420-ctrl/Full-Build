name: Daisy Creative Integrity Tests
on:
  pull_request:
    paths:
      - "src/creative/**"
      - "daisy-ai-os/src/native-os/system-tools/**"
      - "package.json"
      - ".github/workflows/daisy-creative-integrity.yml"
  push:
    branches: [main]
    paths:
      - "src/creative/**"
      - "daisy-ai-os/src/native-os/system-tools/**"
      - "package.json"
      - ".github/workflows/daisy-creative-integrity.yml"
permissions:
  contents: read
jobs:
  creative-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run test:creative-integrity
