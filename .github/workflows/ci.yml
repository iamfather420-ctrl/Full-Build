name: Build and Enterprise CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Fail-closed release safety checks
        run: bun run verify:release-safety
      - name: Daisy foundational instruction and no-simulated-success checks
        run: bun run verify:daisy-safety
      - name: First-party inference fail-closed tests
        run: bun run test:local-inference
      - name: Compile native Daisy server entrypoint
        run: bunx esbuild Solvex-core/server.ts --bundle --platform=node --format=cjs --packages=external --outfile=/tmp/solvex-core-server.cjs
      - name: Payments-disabled boundary checks
        run: bun run verify:payments-disabled
      - name: Establish deterministic workspace path for legacy SOLVEX scripts
        run: |
          if [ ! -e /workspace ]; then sudo ln -s "$GITHUB_WORKSPACE" /workspace; fi
          test "$(readlink -f /workspace)" = "$GITHUB_WORKSPACE"
      - name: Typecheck all SOLVEX source and UI modules
        run: bun run typecheck:solvex
      - name: SOLVEX lifecycle, human-root, and verifier trust-chain tests
        run: bun run test:solvex-lifecycle
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bun run lint
      - name: Enterprise invariants
        run: bun run verify:enterprise
      - name: Formal verification corpus
        run: bun run verify:120
      - name: Proof closure
        run: bun run verify:proof-closure
