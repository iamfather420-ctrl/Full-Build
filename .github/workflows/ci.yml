name: Build and Enterprise CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies from committed Bun lockfile
        run: bun install --frozen-lockfile
      - name: Archive provenance verification
        if: hashFiles('**/Daisy-AI-OS-Complete-With-ISO.tar.part-00', '**/Daisy-AI-OS-Complete-With-ISO.tar.part-01', '**/Daisy-AI-OS-Complete-With-ISO.tar.sha256') != ''
        run: bun run verify:archive-provenance
      - name: Fail-closed contract verification
        run: node scripts/verify_fail_closed_contract.mjs
      - name: Fail-closed release safety checks
        run: bun run verify:release-safety
      - name: Payments-disabled boundary checks
        run: bun run verify:payments-disabled
      - name: Formal evidence hash verification
        run: bun run test:formal-hash
      - name: Formal 120-case verification
        run: bun run verify:120
      - name: Proof closure verification
        run: bun run verify:proof-closure
      - name: Build
        if: always()
        run: bun run build
      - name: TypeScript
        if: always()
        run: bun run lint
      - name: Enterprise invariants
        if: always()
        run: bun run verify:enterprise
