name: Build and Enterprise CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Fail-closed release safety checks
        run: npm run verify:release-safety
      - name: Payments-disabled boundary checks
        run: npm run verify:payments-disabled
      - name: Daisy auth RLS guard static regression tests
        run: npm run test:daisy-auth-rls-guard
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npm run lint
      - name: Enterprise invariants
        run: npm run verify:enterprise
