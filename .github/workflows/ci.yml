name: Build and Enterprise CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOLVEX_SQLITE_PATH: /tmp/solvex-ci-${{ github.run_id }}.sqlite
      # CI-only proof storage is isolated to this ephemeral runner; its HMAC key is generated per run.
      SOLVEX_PROOF_DIR: /tmp/solvex-proof-bundles-${{ github.run_id }}
      SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL }}
      SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
      SOLVEX_NEON_TEST_TENANT_A: ${{ secrets.SOLVEX_NEON_TEST_TENANT_A }}
      SOLVEX_NEON_TEST_TENANT_B: ${{ secrets.SOLVEX_NEON_TEST_TENANT_B }}
      # CI uses the disposable isolation-test database; production NEON_DATABASE_URL stays in the production Environment.
      DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
      SOLVEX_SANDBOX_IMAGE: ghcr.io/iamfather420-ctrl/solvex-sandbox@sha256:0bc2e81bdf48b6c1738cbdc11467f1732937ad3a0fce2e96312e8dcccb6e2e91
      # Live Stage 14 evaluator and external signer configuration; values stay in GitHub Secrets.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOLVEX_ORACLE_SIGNER_URL: ${{ secrets.SOLVEX_ORACLE_SIGNER_URL }}
      SOLVEX_ORACLE_SIGNER_TOKEN: ${{ secrets.SOLVEX_ORACLE_SIGNER_TOKEN }}
      SOLVEX_ORACLE_IMAGE: ${{ secrets.SOLVEX_ORACLE_IMAGE }}
      SOLVEX_ORACLE_ID: ${{ secrets.SOLVEX_ORACLE_ID }}
      SOLVEX_ORACLE_ED25519_PUBLIC_KEY: ${{ secrets.SOLVEX_ORACLE_ED25519_PUBLIC_KEY }}
      SOLVEX_TENANT_ROOT_KEY: ${{ secrets.SOLVEX_TENANT_ROOT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies without rewriting the repository lockfile
        run: bun install --no-save
      - name: Configure ephemeral authenticated proof storage
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          printf 'SOLVEX_PROOF_HMAC_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          unset key
      # CI-only key for the disposable Stage 19 encrypt/decrypt isolation check.
      # Never reuse this ephemeral value for production tenant data.
      - name: Configure ephemeral CI tenant root key
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          printf 'SOLVEX_TENANT_ROOT_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          unset key
      - name: Authenticate to GHCR for digest-pinned Stage 6 sandbox
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$SOLVEX_SANDBOX_IMAGE"
      - name: Verify digest-pinned sandbox input and receipt binding
        run: bunx tsx scripts/verify_stage6_sandbox.ts
      - name: Fail-closed release safety checks
        run: bun run verify:release-safety
      - name: Daisy foundational instruction and no-simulated-success checks
        run: bun run verify:daisy-safety
      - name: First-party inference fail-closed tests
        run: bun run test:local-inference
      - name: Production OIDC configuration alignment regression test
        run: bun run test:production-state
      - name: Compile native Daisy server entrypoint
        run: bunx esbuild Solvex-core/server.ts --bundle --platform=node --format=cjs --packages=external --outfile=/tmp/solvex-core-server.cjs
      - name: Owner authorization fail-closed regression test
        run: bun run test:owner-access
      - name: Payments-disabled boundary checks
        run: bun run verify:payments-disabled
      - name: Sandbox, memory, proof persistence, and tenant crypto tests
        run: bun run test:security-controls
      - name: Disposable Neon tenant isolation integration test
        env:
          SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
          SOLVEX_NEON_TEST_TENANT_A: ${{ secrets.SOLVEX_NEON_TEST_TENANT_A }}
          SOLVEX_NEON_TEST_TENANT_B: ${{ secrets.SOLVEX_NEON_TEST_TENANT_B }}
        run: bash scripts/verify_neon_tenant_isolation_ci.sh
      - name: Signed OIDC tenant-claim lifecycle and RLS integration test
        if: ${{ env.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL != '' }}
        env:
          SOLVEX_NEON_ISOLATION_TEST_CONFIRM: DISPOSABLE_NEON_BRANCH_ONLY
        run: bun run test:oidc-tenant-claims
      - name: Report isolated OIDC integration secret requirement
        if: ${{ env.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL == '' }}
        run: echo "OIDC database integration was validated directly on the isolated Neon branch; add SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL (owner connection for a disposable branch) to enable this CI step."
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bun run lint
      - name: Enterprise invariants
        run: bun run verify:enterprise
      - name: Formal verification corpus
        run: bun run verify:120
      - name: Proof closure
        run: bun run verify:proof-closure
      - name: Authoritative 46-gate verification
        env:
          # Keep the verifier on the same disposable Neon branch used by the OIDC issuer.
          # Step scope avoids changing the isolation integration test's environment.
          NEON_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL }}
        run: bunx tsx scripts/verify_46_gates.ts
      - name: Upload 46-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-46-gates
          path: artifacts/system-46-gates.json
          if-no-files-found: ignore
