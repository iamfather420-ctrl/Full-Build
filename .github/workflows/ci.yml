name: Build and Enterprise CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npm run lint
      - name: Enterprise invariants
        run: npm run verify:enterprise
      - name: Run fresh 120-case Z3 and 46-gate evidence pipeline
        run: npx tsx scripts/verify_120_z3_and_46_gates.ts
      - name: Archive fresh formal and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solvex-formal-120-and-gates-${{ github.run_id }}
          path: |
            artifacts/unified-120-z3-report.json
            artifacts/unified-120-z3-report.md
            artifacts/dh-32-z3-verification.json
            artifacts/system-46-gates.json
            artifacts/system-46-gates.md
          if-no-files-found: warn
          retention-days: 30
      - name: Commit fresh 46-gate JSON to the candidate branch
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/production-readiness-next-steps-20261020'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/system-46-gates.json
          cp artifacts/system-46-gates.json /tmp/system-46-gates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -f -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/system-46-gates.json artifacts/system-46-gates.json
          git add -f artifacts/system-46-gates.json
          if git diff --cached --quiet; then
            echo "Fresh 46-gate JSON is unchanged; no commit needed."
          else
            git commit -m "test: refresh system 46 gate evidence"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
