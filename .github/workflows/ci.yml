name: Build and Enterprise CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL || secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SOLVEX_SANDBOX_IMAGE: ${{ secrets.SOLVEX_SANDBOX_IMAGE }}
      SOLVEX_ORACLE_IMAGE: ${{ secrets.SOLVEX_ORACLE_IMAGE }}
      SOLVEX_ORACLE_ID: ${{ secrets.SOLVEX_ORACLE_ID }}
      SOLVEX_ORACLE_ED25519_PUBLIC_KEY: ${{ secrets.SOLVEX_ORACLE_ED25519_PUBLIC_KEY }}
      SOLVEX_PROOF_DIR: /tmp/solvex-proofs
      SOLVEX_PROOF_HMAC_KEY: ${{ secrets.SOLVEX_PROOF_HMAC_KEY }}
      SOLVEX_TENANT_ROOT_KEY: ${{ secrets.SOLVEX_TENANT_ROOT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install
      - name: Fail-closed release safety checks
        run: bun run verify:release-safety
      - name: Daisy foundational instruction and no-simulated-success checks
        run: bun run verify:daisy-safety
      - name: First-party inference fail-closed tests
        run: bun run test:local-inference
      - name: Production OIDC configuration alignment regression test
        run: bun run test:production-state
      - name: Compile native Daisy server entrypoint
        run: bunx esbuild Solvex-core/server.ts --bundle --platform=node --format=cjs --packages=external --outfile=/tmp/solvex-core-server.cjs
      - name: Owner authorization fail-closed regression test
        run: bun run test:owner-access
      - name: Payments-disabled boundary checks
        run: bun run verify:payments-disabled
      - name: Sandbox, memory, proof persistence, and tenant crypto tests
        run: bun run test:security-controls
      - name: Disposable Neon tenant isolation integration test
        env:
          SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
          SOLVEX_NEON_TEST_TENANT_A: ${{ secrets.SOLVEX_NEON_TEST_TENANT_A }}
          SOLVEX_NEON_TEST_TENANT_B: ${{ secrets.SOLVEX_NEON_TEST_TENANT_B }}
        run: bash scripts/verify_neon_tenant_isolation_ci.sh
      - name: Signed OIDC tenant-claim lifecycle and RLS integration test
        if: ${{ env.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL != '' }}
        env:
          SOLVEX_NEON_ISOLATION_TEST_CONFIRM: DISPOSABLE_NEON_BRANCH_ONLY
        run: bun run test:oidc-tenant-claims
      - name: Report isolated OIDC integration secret requirement
        if: ${{ env.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL == '' }}
        run: echo "OIDC database integration was validated directly on the isolated Neon branch; add SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL (owner connection for a disposable branch) to enable this CI step."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish digest-pinned sandbox image
        id: solvex_sandbox
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/solvex-sandbox:${{ github.sha }}
          build-args: |
            NODE_BASE_IMAGE=node:22.23.2-alpine3.24@sha256:b64da1de5a51067ab8e75f0bc8dbd0905d8894baa22261f439a4572f41291e50

      - name: Pull immutable sandbox digest for local no-pull execution
        env:
          SANDBOX_DIGEST: ${{ steps.solvex_sandbox.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/solvex-sandbox@${SANDBOX_DIGEST}"
          docker pull "$image"
          echo "SOLVEX_SANDBOX_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Create ephemeral CI-only proof and tenant keys
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/solvex-proofs"
          echo "SOLVEX_PROOF_DIR=$GITHUB_WORKSPACE/artifacts/solvex-proofs" >> "$GITHUB_ENV"
          echo "SOLVEX_PROOF_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SOLVEX_TENANT_ROOT_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Prepare isolated Neon identity for authoritative GATE-12
        if: always()
        env:
          SOLVEX_NEON_ISOLATION_TEST_CONFIRM: DISPOSABLE_NEON_BRANCH_ONLY
        run: |
          if [[ -n "$SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL" ]]; then
            bash scripts/prepare_gate12_neon_claim.sh
          else
            echo "::warning::GATE-12 remains BLOCKED: configure SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL with an isolated disposable Neon branch owner URL."
          fi
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bun run lint
      - name: Enterprise invariants
        run: bun run verify:enterprise
      - name: Formal verification corpus
        run: bun run verify:120
      - name: Proof closure
        run: bun run verify:proof-closure
      - name: Configure measured runner memory budget
        if: always()
        run: |
          limit="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || true)"
          if [[ "$limit" =~ ^[0-9]+$ ]]; then
            budget="$limit"
            echo "Runner cgroup hard memory limit: $limit bytes"
          else
            budget=2147483648
            echo "Runner has no finite cgroup memory.max; enforcing a 2 GiB observed peak-RSS budget."
          fi
          echo "SOLVEX_MEMORY_LIMIT_BYTES=$budget" >> "$GITHUB_ENV"
      - name: Authoritative 46-gate verification
        run: bunx tsx scripts/verify_46_gates.ts
      - name: Clean up isolated Neon GATE-12 identity
        if: always()
        run: |
          if [[ -n "$SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL" ]]; then
            bash scripts/cleanup_gate12_neon_claim.sh
          else
            echo "No isolated Neon GATE-12 fixtures to clean up."
          fi
      - name: Upload 46-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-46-gates
          path: artifacts/system-46-gates.json
          if-no-files-found: ignore
