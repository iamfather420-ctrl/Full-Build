name: Build and Enterprise CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, fix/46-gate-baseline-lifecycle-sandbox]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL }}
      SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
      SOLVEX_NEON_TEST_TENANT_A: ${{ secrets.SOLVEX_NEON_TEST_TENANT_A }}
      SOLVEX_NEON_TEST_TENANT_B: ${{ secrets.SOLVEX_NEON_TEST_TENANT_B }}
      NEON_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
      SOLVEX_MEMORY_LIMIT_BYTES: '2147483648'
      # Stage 14 uses short-lived GitHub OIDC for Fly evaluation and Railway signing.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install exact dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile
      - name: Build and publish digest-pinned Stage 6 sandbox
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/iamfather420-ctrl/solvex-sandbox:ci-$GITHUB_SHA"
          NODE_BASE_IMAGE="node:22.16.0-bookworm-slim@sha256:048ed02c5fd52e86fda6fbd2f6a76cf0d4492fd6c6fee9e2c463ed5108da0e34"
          docker build --platform linux/amd64 --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" -f sandbox/Dockerfile -t "$IMAGE" sandbox
          docker push "$IMAGE"
          DIGEST="$(docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v prefix="ghcr.io/iamfather420-ctrl/solvex-sandbox@" 'index($0,prefix)==1 { sub(prefix,""); print; exit }')"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "Could not resolve the pushed sandbox manifest digest." >&2
            exit 1
          fi
          echo "SOLVEX_SANDBOX_IMAGE=ghcr.io/iamfather420-ctrl/solvex-sandbox@$DIGEST" >> "$GITHUB_ENV"
          echo "Published current-source sandbox image at immutable digest $DIGEST"
      - name: Stage 14 signer authentication and Ed25519 regression tests
        run: bun run test:oracle-signer
      - name: Stage 14 Fly gateway OIDC trust regression tests
        run: bunx tsx --test artifacts/api-server/src/stage14-oidc.test.ts
      - name: Fail-closed release safety checks
        run: bun run verify:release-safety
      - name: Daisy foundational instruction and no-simulated-success checks
        run: bun run verify:daisy-safety
      - name: First-party inference fail-closed tests
        run: bun run test:local-inference
      - name: Daisy llama.cpp output parser regression tests
        run: bunx tsx --test scripts/test_inference_output_parser.ts
      - name: Daisy authenticated API and withheld-only discovery regression tests
        run: bun run test:daisy-ai-api
      - name: Vercel API rewrite does not hide Daisy routes
        run: bunx tsx --test scripts/test_vercel_api_rewrite.ts
      - name: Daisy Vercel proxy host-pinning and same-origin security tests
        run: bunx tsx --test src/api/DaisyVercelProxyRouter.test.ts
      - name: System 46 release-guard regression tests
        run: bun run test:system46-guard
      - name: Provider gate payments-disabled policy regression tests
        run: bun run test:provider-gate-policy
      - name: Production OIDC configuration alignment regression test
        run: bun run test:production-state
      - name: OIDC production authentication boundary guard
        run: bun run verify:auth-boundary
      - name: Compile native Daisy server entrypoint
        run: bunx esbuild Solvex-core/server.ts --bundle --platform=node --format=cjs --packages=external --outfile=/tmp/solvex-core-server.cjs
      - name: Owner authorization fail-closed regression test
        run: bun run test:owner-access
      - name: Payments-disabled boundary checks
        run: bun run verify:payments-disabled
      - name: Sandbox, memory, proof persistence, and tenant crypto tests
        run: bun run test:security-controls
      - name: 21-stage solution pipeline execution trace
        run: bun run test:solution-pipeline
      # Dependabot and fork PR workflows do not receive repository secrets.
      # Keep all secret-independent CI checks running, but never downgrade a
      # secret-dependent Neon integration test into a false pass.
      - name: Disposable Neon tenant isolation integration test
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
          SOLVEX_NEON_TEST_TENANT_A: ${{ secrets.SOLVEX_NEON_TEST_TENANT_A }}
          SOLVEX_NEON_TEST_TENANT_B: ${{ secrets.SOLVEX_NEON_TEST_TENANT_B }}
        run: bash scripts/verify_neon_tenant_isolation_ci.sh
      - name: Signed OIDC tenant-claim lifecycle and RLS integration test
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && env.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL != '' }}
        env:
          SOLVEX_NEON_ISOLATION_TEST_CONFIRM: DISPOSABLE_NEON_BRANCH_ONLY
        run: bun run test:oidc-tenant-claims
      - name: Report secret-restricted Neon integration context
        if: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: echo "Neon secret-dependent integration tests were skipped because GitHub does not expose repository secrets to Dependabot or fork pull-request workflows. They remain required on trusted main-branch and authorized non-fork runs."
      - name: Report isolated OIDC integration secret requirement
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && env.SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL == '' }}
        run: echo "OIDC database integration was not run because SOLVEX_NEON_ISOLATION_MIGRATION_DATABASE_URL is not configured in this trusted run; configure the owner connection for a disposable branch to enable this CI step."
      - name: Stage 7 strict static typing regression tests
        run: bun run test:stage7-static-typing
      - name: Validate 45-gate sequence and separate closure inventory
        run: bun run test:45-gate-inventory
      - name: Build
        run: bun run build
      - name: Compile Vercel API function and shared Node server
        run: |
          bunx esbuild 'api/[...path].ts' --bundle --platform=node --format=esm --packages=external --outfile=/tmp/solvex-vercel-api.mjs
          bunx esbuild server.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/solvex-node-server.mjs
      - name: TypeScript
        run: bun run lint
      - name: Install Lean 4 and execute the checked-in proof
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          bunx tsx -e 'import { verifyLeanProof } from "./src/proofs/ExternalProver.ts"; const evidence = verifyLeanProof(); if (!evidence.prover_execution_verified || evidence.exit_code !== 0 || evidence.binary_basename !== "lean") { console.error(JSON.stringify(evidence)); process.exit(1); } console.log(JSON.stringify({ prover: evidence.prover, exit_code: evidence.exit_code, source_sha256: evidence.source_sha256, binary_basename: evidence.binary_basename }));'
      - name: Install pinned Coq proof checker
        run: |
          set -euo pipefail
          IMAGE_TAG="coqorg/coq:8.20.1"
          echo "Pulling maintained Coq 8.20.1 image: $IMAGE_TAG"
          timeout --signal=TERM --kill-after=30s 30m docker pull "$IMAGE_TAG"
          IMAGE_REF="$(docker image inspect "$IMAGE_TAG" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep '^coqorg/coq@sha256:' | head -n 1)"
          if ! printf '%s' "$IMAGE_REF" | grep -Eq '^coqorg/coq@sha256:[a-f0-9]{64}$'; then
            echo "Could not resolve the Coq image to an immutable registry digest." >&2
            exit 1
          fi
          echo "Resolved Coq image: $IMAGE_REF"
          # The Coq image runs as an unprivileged user. Give it a fresh,
          # runner-owned writable output directory rather than mounting a
          # root-owned or stale /tmp directory from an earlier attempt.
          mkdir -p "$RUNNER_TEMP/solvex-coq-proof"
          chmod 0777 "$RUNNER_TEMP/solvex-coq-proof"
          cat > "$RUNNER_TEMP/coqc" <<'COQC_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -v "$PWD:/workspace" -v "$RUNNER_TEMP/solvex-coq-proof:/tmp/solvex-coq-proof" -w /workspace --entrypoint opam "$SOLVEX_COQ_IMAGE" exec -- coqc "$@"
          COQC_WRAPPER
          chmod 755 "$RUNNER_TEMP/coqc"
          echo "SOLVEX_COQ_IMAGE=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "SOLVEX_COQC_BIN=$RUNNER_TEMP/coqc" >> "$GITHUB_ENV"
          export SOLVEX_COQ_IMAGE="$IMAGE_REF"
          export SOLVEX_COQC_BIN="$RUNNER_TEMP/coqc"
          echo "Smoke-testing the pinned Coq compiler."
          "$RUNNER_TEMP/coqc" --version
      - name: Pull pinned Isabelle/HOL image
        run: |
          set -euo pipefail
          IMAGE_REF="makarius/isabelle@sha256:9bd33b183c399327c5d554fc8cde27c29b5d2b20cdc6fe7a604caa3f951018fc"
          echo "Pulling pinned Isabelle image: $IMAGE_REF"
          timeout --signal=TERM --kill-after=30s 20m docker pull "$IMAGE_REF"
          echo "Pinned Isabelle image is available."
          export SOLVEX_ISABELLE_IMAGE="$IMAGE_REF"
          cat > "$RUNNER_TEMP/isabelle" <<'ISABELLE_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          while (($#)); do
            if [[ "$1" == "-D" && $# -ge 2 ]]; then
              args+=("-D" "/workspace/$2")
              shift 2
            else
              args+=("$1")
              shift
            fi
          done
          # Preserve the image's declared working directory because its
          # ENTRYPOINT is relative: Isabelle/bin/isabelle.
          exec docker run --rm -v "$PWD:/workspace" "$SOLVEX_ISABELLE_IMAGE" "${args[@]}"
          ISABELLE_WRAPPER
          chmod 755 "$RUNNER_TEMP/isabelle"
          echo "SOLVEX_ISABELLE_IMAGE=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "SOLVEX_ISABELLE_BIN=$RUNNER_TEMP/isabelle" >> "$GITHUB_ENV"
          echo "Smoke-testing the pinned Isabelle container entrypoint."
          "$RUNNER_TEMP/isabelle" version
      - name: Execute checked-in Coq proof
        run: |
          set -euo pipefail
          if [[ -z "${SOLVEX_COQC_BIN:-}" || ! -x "$SOLVEX_COQC_BIN" ]]; then
            echo "Pinned Coq wrapper is missing or not executable: ${SOLVEX_COQC_BIN:-<unset>}" >&2
            exit 1
          fi
          echo "Compiling formal/coq/BoundedZeno.v with the pinned Coq container wrapper."
          mkdir -p /tmp/solvex-coq-proof
          timeout --signal=TERM --kill-after=30s 5m "$SOLVEX_COQC_BIN" -q -no-glob -o /tmp/solvex-coq-proof/BoundedZeno.vo formal/coq/BoundedZeno.v
          echo "Coq proof compilation completed."
      - name: Verify Coq execution receipt
        run: |
          set -euo pipefail
          echo "Running the repository's independent Coq evidence verifier."
          timeout --signal=TERM --kill-after=30s 5m bunx tsx -e 'import { verifyCoqProof } from "./src/proofs/ExternalProver.ts"; const result = verifyCoqProof(); console.log(JSON.stringify(result)); if (!result.prover_execution_verified || result.exit_code !== 0) process.exit(1);'
      - name: Verify Isabelle/HOL execution receipt
        run: |
          set -euo pipefail
          echo "Running the repository's Isabelle/HOL build and evidence verifier."
          timeout --signal=TERM --kill-after=30s 15m bunx tsx -e 'import { verifyIsabelleProof } from "./src/proofs/ExternalProver.ts"; const result = verifyIsabelleProof(); console.log(JSON.stringify(result)); if (!result.prover_execution_verified || result.exit_code !== 0) process.exit(1);'
      - name: Daisy cognitive regression, including DN-25 and DN-45
        run: bunx tsx --test --test-concurrency=1 src/brain/CognitiveMilestone.test.ts src/brain/SecurityRepairs.test.ts src/brain/DaisyTrainingEvidence.test.ts src/security/RangeProof.test.ts src/proofs/ExternalProver.test.ts src/nodes/all54Execution.test.ts src/nodes/nodeVerdict.test.ts src/nodes/distributedProtocolModels.test.ts
      - name: 3-of-3 independent model consensus and Neon replay-store tests
        run: bun run test:consensus
      - name: Production deployment requires fresh 3-of-3 consensus certificate
        run: bun run test:production-consensus
      - name: Enterprise invariants
        run: bun run verify:enterprise
      - name: Formal verification corpus
        run: bun run verify:120
      - name: Prepare ephemeral local proof and tenant crypto keys
        run: |
          set -euo pipefail
          mkdir -p /tmp/solvex-proof-store
          chmod 700 /tmp/solvex-proof-store
          PROOF_HMAC_KEY="$(openssl rand -hex 32)"
          TENANT_ROOT_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROOF_HMAC_KEY"
          echo "::add-mask::$TENANT_ROOT_KEY"
          echo "SOLVEX_PROOF_DIR=/tmp/solvex-proof-store" >> "$GITHUB_ENV"
          echo "SOLVEX_PROOF_HMAC_KEY=$PROOF_HMAC_KEY" >> "$GITHUB_ENV"
          echo "SOLVEX_TENANT_ROOT_KEY=$TENANT_ROOT_KEY" >> "$GITHUB_ENV"
      - name: Lifecycle proof-closure contract regression tests
        run: bunx tsx --test src/proofs/lifecycleProofClosure.test.ts
      - name: Proof closure
        run: bun run verify:proof-closure
      - name: Execute the authoritative 45-gate sequence
        id: authoritative_45
        env:
          SOLVEX_NODE_EXTERNAL_PROBES: 'true'
          # Use only the disposable Neon validation branch configured above.
          SOLVEX_E2E_USE_DISPOSABLE_NEON: 'true'
        run: |
          rm -f artifacts/system-45-gates.json artifacts/system-46-closure-gate.json
          bun run verify:45-gates || node scripts/ci_nonproduction_gate_policy.mjs 45
      - name: Evaluate the subsequent GATE-46 closure separately
        if: ${{ always() && steps.authoritative_45.outcome != 'skipped' }}
        run: |
          bun run verify:46-closure || node scripts/ci_nonproduction_gate_policy.mjs 46
      - name: Upload separate 45-gate and GATE-46 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solvex-45-gates-and-separate-46-closure-${{ github.sha }}
          path: |
            artifacts/system-45-gates.json
            artifacts/system-46-closure-gate.json
            artifacts/daisy-54-node-execution.json
            artifacts/execution-gates.json
          if-no-files-found: warn
