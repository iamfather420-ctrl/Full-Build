name: Build and Enterprise CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Fail-closed release safety checks
        run: bun run verify:release-safety
      - name: Payments-disabled boundary checks
        run: bun run verify:payments-disabled
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bun run lint
      - name: Enterprise invariants
        run: bun run verify:enterprise
      - name: Formal verification corpus
        run: bun run verify:120
      - name: Proof closure
        run: bun run verify:proof-closure
