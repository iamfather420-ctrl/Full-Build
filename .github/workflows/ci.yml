name: Build and Enterprise CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Archive provenance verification
        run: npm run verify:archive-provenance
      - name: Fail-closed contract verification
        run: node scripts/verify_fail_closed_contract.mjs
      - name: Fail-closed release safety checks
        run: npm run verify:release-safety
      - name: Payments-disabled boundary checks
        run: npm run verify:payments-disabled
      - name: Formal 120-case verification
        run: npm run verify:120
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npm run lint
      - name: Enterprise invariants
        run: npm run verify:enterprise
