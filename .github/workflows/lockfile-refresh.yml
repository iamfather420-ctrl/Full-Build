name: Temporary lockfile refresh
on:
  push:
    branches:
      - "lockfile-refresh/**"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Regenerate Bun lockfile from workspace manifests
        run: bun install
      - name: Regenerate npm lockfile from workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm clean install
        run: npm ci --no-audit --no-fund
      - name: Verify frozen Bun install
        run: bun install --frozen-lockfile
      - name: Commit refreshed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize Bun and npm lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
