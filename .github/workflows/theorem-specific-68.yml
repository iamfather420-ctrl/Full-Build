name: theorem-specific-68-verification

on:
  pull_request:
  push:
    branches:
      - dfrl/real-68-theorem-models

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run verify:dfrl
