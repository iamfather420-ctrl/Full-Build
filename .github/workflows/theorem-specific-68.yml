name: theorem-specific-68-verification

on:
  pull_request:
  push:
    branches:
      - dfrl/real-68-theorem-models

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript lint
        run: npm run lint > tsc-errors.txt 2>&1

      - name: Preserve compiler diagnostics
        if: failure()
        run: |
          cat tsc-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsc-errors.txt
          git diff --cached --quiet || git commit -m "diagnostic: capture TypeScript verification errors [skip ci]"
          git push
      - run: npm run verify:dfrl
