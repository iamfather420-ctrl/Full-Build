name: Authoritative 120-Case Verification

on:
  push:
    branches: [main, master, manus/solvex-reconciled-20261002]
  pull_request:
    branches: [main, master, manus/solvex-reconciled-20261002]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: PRODUCTION
    env:
      SOLVEX_ENV: production
      SOLVEX_ENVIRONMENT: production
      PAYPAL_ACTIVE_ENVIORMENT: ${{ secrets.PAYPAL_ACTIVE_ENVIORMENT }}
      PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ACTIVE_ENVIORMENT }}
      PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
      PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
      PAYPAL_LIVE_CLIENT_ID: ${{ secrets.PAYPAL_LIVE_CLIENT_ID }}
      PAYPAL_LIVE_CLIENT_SECRET: ${{ secrets.PAYPAL_LIVE_CLIENT_SECRET }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (clean, reproducible)
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          # Ensure critical binaries are present
          npx tsx --version
          node -e "require('z3-solver')" || echo "z3-solver will be resolved at runtime"

      - name: Type-check
        run: npx tsc --noEmit || true

      - name: Run Unified 120-Case Reproducible Verification Corpus
        id: verify
        run: |
          echo "Starting authoritative verification against commit $(git rev-parse HEAD)"
          npm run verify:120
        env:
          CI: true

      - name: Print final accounting summary
        if: always()
        run: |
          echo "## Authoritative Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Command:** \`npm run verify:120\`" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/dfrl-88-verification.json ]; then
            echo "### DFRL 88" >> $GITHUB_STEP_SUMMARY
            node -e '
              const r = require("./artifacts/dfrl-88-verification.json");
              console.log("- executed:", r.executed);
              console.log("- unsat:", r.unsat_count ?? r.unsat_proved_count);
              console.log("- sat:", r.sat_count);
              console.log("- unknown:", r.unknown_count);
              console.log("- errors:", r.error_count);
              console.log("- replays:", r.deterministic_replays_matched);
              console.log("- root:", r.verification_root_sha256);
            ' >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f artifacts/dh-bootstrap-32-verification.json ]; then
            echo "### DH-P 32" >> $GITHUB_STEP_SUMMARY
            node -e '
              const r = require("./artifacts/dh-bootstrap-32-verification.json");
              console.log("- executed:", r.executed);
              console.log("- replays:", r.replay_matches ?? r.deterministic_replays_matched);
              console.log("- unknown:", r.unknown_count);
              console.log("- errors:", r.error_count);
            ' >> $GITHUB_STEP_SUMMARY || true
          fi
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY || true

      - name: Assert Daisy Brain activation gate
        if: always()
        run: |
          if [ ! -f artifacts/daisy-brain-activation-gate.json ]; then
            echo "Missing Daisy activation gate"
            exit 1
          fi
          node -e '
            const g = require("./artifacts/daisy-brain-activation-gate.json");
            if (g.status !== "ACTIVE") { console.error("DAISY BRAIN ACTIVATION GATE BLOCKED", g); process.exit(1); }
            if (g.corpus?.total_required !== 120 || g.corpus?.executed !== 120 || g.corpus?.deterministic_replays !== 120 || g.corpus?.unknown !== 0 || g.corpus?.errors !== 0) { console.error("DAISY BRAIN CORPUS ACCOUNTING FAILED", g); process.exit(1); }
            console.log("DAISY BRAIN ACTIVATION GATE ACTIVE: 120/120 corpus verified and replayed");
          '

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-verification-${{ github.sha }}
          path: |
            artifacts/
            DFRL-88-MACHINE-VERIFICATION-AUDIT.json
            DFRL-88-MACHINE-VERIFICATION-AUDIT.md
            enterprise-verification-report.json
            production-gate-evaluation.json
            execution-gates.json
          retention-days: 30
          if-no-files-found: warn

      - name: Fail if verification did not produce 120/120
        if: always()
        run: |
          if [ ! -f artifacts/dfrl-88-verification.json ] || [ ! -f artifacts/dh-bootstrap-32-verification.json ]; then
            echo "Missing verification artifacts"
            exit 1
          fi
          node -e '
            const dfrl = require("./artifacts/dfrl-88-verification.json");
            const dh = require("./artifacts/dh-bootstrap-32-verification.json");
            const dhReplays = dh.replay_matches ?? dh.deterministic_replays_matched;
            const ok = dfrl.executed === 88 && dfrl.deterministic_replays_matched === 88 &&
                       dfrl.unknown_count === 0 && dfrl.error_count === 0 &&
                       dh.executed === 32 && dhReplays === 32 &&
                       dh.unknown_count === 0 && dh.error_count === 0;
            if (!ok) {
              console.error("120-case gate FAILED");
              console.error("DFRL:", {executed: dfrl.executed, replays: dfrl.deterministic_replays_matched, unknown: dfrl.unknown_count, errors: dfrl.error_count});
              console.error("DH:", {executed: dh.executed, replays: dhReplays, unknown: dh.unknown_count, errors: dh.error_count});
              process.exit(1);
            }
            console.log("120-case gate PASSED");
          '

# Combined 120-case authoritative gate execution trigger: DFRL 88 + DH-P 32.
