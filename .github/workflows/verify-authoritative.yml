name: Authoritative 120-Case Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      production_release:
        description: 'Run protected production readiness checks (payments remain disabled)'
        required: true
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # PR validation uses a non-production environment; production checks remain protected.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.production_release && 'production' || 'ci' }}
      deployment: false
    env:
      SOLVEX_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.production_release && 'production' || 'ci' }}
      PAYMENTS_ENABLED: 'false'
      NEON_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.production_release && secrets.NEON_DATABASE_URL || secrets.NEON_VALIDATION_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and reconcile stale lock metadata
        run: |
          bun install
          bunx tsx --version
          bun -e "import('z3-solver').then(() => console.log('z3-solver resolved')).catch((error) => { console.error(error); process.exit(1); })"

      - name: Production preflight
        if: github.event_name == 'workflow_dispatch' && inputs.production_release
        run: bun run preflight

      - name: Production runtime wiring verification
        if: github.event_name == 'workflow_dispatch' && inputs.production_release
        run: bun run verify:production-runtime

      - name: Type-check
        if: always()
        run: bun run lint

      - name: Run Unified 120-Case Reproducible Verification Corpus
        if: always()
        id: verify
        run: |
          echo "Starting authoritative verification against commit $(git rev-parse HEAD)"
          bun run verify:120
        env:
          CI: true

      - name: Print final accounting summary
        if: always()
        run: |
          echo "## Authoritative Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Command:** \`bun run verify:120\`" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/dfrl-88-verification.json ]; then
            echo "### DFRL 88" >> $GITHUB_STEP_SUMMARY
            node -e '
              const r = require("./artifacts/dfrl-88-verification.json");
              console.log("- executed:", r.executed);
              console.log("- unsat:", r.unsat_count ?? r.unsat_proved_count);
              console.log("- sat:", r.sat_count);
              console.log("- unknown:", r.unknown_count);
              console.log("- errors:", r.error_count);
              console.log("- replays:", r.deterministic_replays_matched);
              console.log("- root:", r.verification_root_sha256);
            ' >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f artifacts/dh-bootstrap-32-verification.json ]; then
            echo "### DH-P 32" >> $GITHUB_STEP_SUMMARY
            node -e '
              const r = require("./artifacts/dh-bootstrap-32-verification.json");
              console.log("- executed:", r.executed);
              console.log("- replays:", r.deterministic_replays_matched);
              console.log("- unknown:", r.unknown_count);
              console.log("- errors:", r.error_count);
            ' >> $GITHUB_STEP_SUMMARY || true
          fi
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY || true

      - name: Assert formal corpus and production activation gate
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.production_release && 'true' || 'false' }}
        run: |
          if [ ! -f artifacts/daisy-brain-activation-gate.json ]; then
            echo "Missing Daisy activation gate"
            exit 1
          fi
          node -e '
            const g = require("./artifacts/daisy-brain-activation-gate.json");
            const corpusOk = g.corpus?.total_required === 120 && g.corpus?.executed === 120 && g.corpus?.deterministic_replays === 120 && g.corpus?.unknown === 0 && g.corpus?.errors === 0;
            if (!corpusOk) { console.error("DAISY BRAIN CORPUS ACCOUNTING FAILED", g); process.exit(1); }
            if (process.env.PRODUCTION_RELEASE !== "true") {
              console.log("Non-release verification: formal corpus passed; production activation remains gated and is not required for CI.");
              console.log("Current activation status:", g.status, "— not a production-readiness approval.");
            } else {
              if (g.status !== "ACTIVE") { console.error("PRODUCTION ACTIVATION GATE BLOCKED", g); process.exit(1); }
              console.log("PRODUCTION ACTIVATION GATE ACTIVE: all gates and 120-case corpus passed");
            }
          '

      - name: Validate fresh formal and lifecycle evidence
        if: success()
        run: bun run verify:ci

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-verification-${{ github.sha }}
          path: |
            artifacts/
            DFRL-88-MACHINE-VERIFICATION-AUDIT.json
            DFRL-88-MACHINE-VERIFICATION-AUDIT.md
            enterprise-verification-report.json
            production-gate-evaluation.json
            execution-gates.json
          retention-days: 30
          if-no-files-found: warn

      - name: Fail if verification did not produce 120/120
        if: always()
        run: |
          if [ ! -f artifacts/dfrl-88-verification.json ] || [ ! -f artifacts/dh-bootstrap-32-verification.json ]; then
            echo "Missing verification artifacts"
            exit 1
          fi
          node -e '
            const dfrl = require("./artifacts/dfrl-88-verification.json");
            const dh = require("./artifacts/dh-bootstrap-32-verification.json");
            const ok = dfrl.executed === 88 && dfrl.deterministic_replays_matched === 88 &&
                       dfrl.unknown_count === 0 && dfrl.error_count === 0 &&
                       dh.executed === 32 && dh.replay_matches === 32 &&
                       dh.unknown_count === 0 && dh.error_count === 0;
            if (!ok) {
              console.error("120-case gate FAILED");
              console.error("DFRL:", {executed: dfrl.executed, replays: dfrl.deterministic_replays_matched, unknown: dfrl.unknown_count, errors: dfrl.error_count});
              console.error("DH:", {executed: dh.executed, replays: dh.deterministic_replays_matched, unknown: dh.unknown_count, errors: dh.error_count});
              process.exit(1);
            }
            console.log("120-case gate PASSED");
          '

# Combined 120-case authoritative gate execution trigger: DFRL 88 + DH-P 32.
