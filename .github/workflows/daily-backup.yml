name: Daily Backup

on:
  schedule:
    # Runs once per day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create dated code backup archive
        run: |
          set +e
          DATE=$(date -u +%Y-%m-%d)
          ARCHIVE="solvex-backup-${DATE}.tar.gz"
          tar -czf "$ARCHIVE" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='build' \
            .
          TAR_EXIT=$?
          set -e
          # tar exit 1 is the common "file changed as we read it" warning; treat as success
          if [ $TAR_EXIT -gt 1 ]; then
            echo "tar failed with exit code $TAR_EXIT"
            exit $TAR_EXIT
          fi
          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive was not created"
            exit 1
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump Neon database
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret is not set. Skipping database dump."
            echo "SKIP_DB=true" >> "$GITHUB_ENV"
            exit 0
          fi
          DUMP="neon-dump-${DATE}.sql.gz"
          echo "Creating Neon dump: $DUMP"
          pg_dump "$NEON_DATABASE_URL" --no-owner --no-acl --clean --if-exists | gzip > "$DUMP"
          ls -lh "$DUMP"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"
          echo "SKIP_DB=false" >> "$GITHUB_ENV"

      - name: Upload code backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: solvex-daily-backup-${{ github.run_id }}
          path: solvex-backup-*.tar.gz
          retention-days: 30

      - name: Upload Neon dump artifact
        if: env.SKIP_DB != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neon-daily-dump-${{ github.run_id }}
          path: neon-dump-*.sql.gz
          retention-days: 30

      - name: Summary
        run: |
          echo "Code backup completed: ${{ env.ARCHIVE }}"
          if [ "${{ env.SKIP_DB }}" = "true" ]; then
            echo "Neon dump skipped (NEON_DATABASE_URL secret not set)."
          else
            echo "Neon dump completed: ${{ env.DUMP }}"
          fi
          echo "Artifacts retained for 30 days."
