name: Daily Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solvex-daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create dated code backup archive
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          ARCHIVE="solvex-backup-${DATE}.tar.gz"

          set +e
          tar -czf "$ARCHIVE" \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./dist' \
            --exclude='./build' \
            .
          TAR_EXIT=$?
          set -e

          # exit 1 is the common "file changed as we read it" warning
          if [ "$TAR_EXIT" -gt 1 ]; then
            echo "tar failed with exit code $TAR_EXIT"
            exit "$TAR_EXIT"
          fi

          test -s "$ARCHIVE"
          gzip -t "$ARCHIVE"
          sha256sum "$ARCHIVE"

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create and verify Neon database dump
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::NEON_DATABASE_URL is unavailable. Check the job environment and secret configuration."
            exit 1
          fi

          DUMP="neon-dump-${DATE}.dump"
          echo "Creating PostgreSQL custom-format backup..."

          pg_dump \
            --dbname="$NEON_DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="$DUMP"

          test -s "$DUMP"
          echo "Checking backup archive..."
          pg_restore --list "$DUMP" > /tmp/solvex-restore-list.txt
          test -s /tmp/solvex-restore-list.txt

          echo "Backup SHA-256:"
          sha256sum "$DUMP"
          echo "Backup size:"
          ls -lh "$DUMP"

          echo "DUMP=$DUMP" >> "$GITHUB_ENV"

      - name: Upload code backup
        uses: actions/upload-artifact@v4
        with:
          name: solvex-code-backup-${{ github.run_id }}
          path: solvex-backup-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified Neon database dump
        uses: actions/upload-artifact@v4
        with:
          name: solvex-neon-backup-${{ github.run_id }}
          path: neon-dump-*.dump
          if-no-files-found: error
          retention-days: 30

      - name: Backup summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "SOLVEX daily backup job status: $JOB_STATUS"
          echo "Scheduled daily at 03:00 UTC."
          echo "GitHub artifact retention: 30 days."
