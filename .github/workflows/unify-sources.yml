name: Unify source repositories into Full-Build

on:
  push:
    branches:
      - integration/full-unification-2026-10-02

permissions:
  contents: write

jobs:
  unify:
    if: "!contains(github.event.head_commit.message, 'merge: reconcile imported sources')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/full-unification-2026-10-02
          fetch-depth: 0
          persist-credentials: true
      - name: Merge source histories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Full-Build Unification"
          git config user.email "actions@github.com"
          git remote add web-build https://github.com/iamfather420-ctrl/web-build.git
          git remote add clean-web https://github.com/Solvex-Paradox-Box/CLEAN-WEB-CONSOLIDATED.git
          git fetch web-build main
          git fetch clean-web main
          git merge --no-edit --allow-unrelated-histories -X ours web-build/main || {
            git add -A
            git commit -m "merge: reconcile imported sources from web-build"
          }
          git merge --no-edit --allow-unrelated-histories -X ours clean-web/main || {
            git add -A
            git commit -m "merge: reconcile imported sources from CLEAN-WEB-CONSOLIDATED"
          }
          git push origin HEAD:integration/full-unification-2026-10-02
