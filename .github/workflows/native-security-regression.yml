name: Native security regression checks
on:
  pull_request:
    paths:
      - 'src/proofs/NOPOTProof.ts'
      - 'src/proofs/Z3FormalProofEngine.ts'
      - 'src/mmtai/MMTAIProtocol.ts'
      - 'scripts/verify_native_security_fixes.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run verify:native-security-fixes
      - run: npm run lint
      - run: npm run build
