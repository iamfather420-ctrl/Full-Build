name: Daisy SmolLM2 Training Gate

on:
  pull_request:
    paths:
      - "training/daisy-smollm2/**"
      - "scripts/prepare_loc_english_corpus.mjs"
      - "scripts/prepare_loc_language_model_corpus.mjs"
      - "scripts/loc_corpus_eligibility.mjs"
      - "scripts/loc_corpus_eligibility.test.mjs"
      - "artifacts/training/loc-english/**"
      - "data/training_sources/public_domain/english"
      - ".github/workflows/daisy-smollm2-validation.yml"
  push:
    branches:
      - "main"
      - "feat/daisy-smollm2-local-training"
    paths:
      - "training/daisy-smollm2/**"
      - "scripts/prepare_loc_english_corpus.mjs"
      - "scripts/prepare_loc_language_model_corpus.mjs"
      - "scripts/loc_corpus_eligibility.mjs"
      - "scripts/loc_corpus_eligibility.test.mjs"
      - "artifacts/training/loc-english/**"
      - "data/training_sources/public_domain/english"
      - ".github/workflows/daisy-smollm2-validation.yml"

permissions:
  contents: read

jobs:
  validate-training-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run optimizer authorization boundary tests
        run: |
          set -euo pipefail
          node --test training/daisy-smollm2/verify-authorization.test.mjs training/daisy-smollm2/verify-book-approvals.test.mjs scripts/loc_corpus_eligibility.test.mjs
          python training/daisy-smollm2/test_training_gate.py
      - name: Compile trainer
        run: python -m py_compile training/daisy-smollm2/train.py training/daisy-smollm2/train_text.py training/daisy-smollm2/training_gate.py
      - name: Verify missing corpus blocks before model download
        shell: bash
        run: |
          set -euo pipefail
          output="$(DAISY_TRAIN_FILE=/tmp/daisy-corpus-must-not-exist.jsonl DAISY_OUTPUT_DIR=/tmp/daisy-output-must-not-exist python training/daisy-smollm2/train.py 2>&1 || true)"
          printf '%s\n' "$output"
          grep -q "BLOCKED: verified training corpus not found" <<< "$output"
          test ! -e /tmp/daisy-output-must-not-exist
      - name: Verify LOC corpus preparation remains blocked and immutable
        shell: bash
        run: |
          set -euo pipefail
          corpus="artifacts/training/loc-english/language-model-corpus.jsonl"
          before="$(sha256sum "$corpus" | cut -d' ' -f1)"
          output="$(node scripts/prepare_loc_language_model_corpus.mjs 2>&1 || true)"
          printf '%s\n' "$output"
          grep -q "NOT_APPROVED\|PENDING_REVIEW\|not_approved" <<< "$output"
          after="$(sha256sum "$corpus" | cut -d' ' -f1)"
          test "$before" = "$after"
      - name: Verify staged LOC corpus cannot enter text training
        shell: bash
        run: |
          set -euo pipefail
          output="$(DAISY_LM_TRAIN_FILE=artifacts/training/loc-english/language-model-corpus.jsonl DAISY_OUTPUT_DIR=/tmp/daisy-staged-training-must-not-exist python training/daisy-smollm2/train_text.py 2>&1 || true)"
          printf '%s\n' "$output"
          grep -q "BLOCKED: Dataset contains not_approved records" <<< "$output"
          test ! -e /tmp/daisy-staged-training-must-not-exist
