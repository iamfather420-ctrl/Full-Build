name: Build and publish Daisy AI OS release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build-amd64:
    name: Build x86_64 image and runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build x86_64 runtime and image
        run: |
          mkdir -p dist/native dist/native-release dist/os
          npx esbuild runtime/src/server.ts --bundle --platform=node --format=cjs --outfile=dist/native/aios-runtime.cjs
          printf '%s' '{"main":"dist/native/aios-runtime.cjs","output":"dist/native/aios-runtime.blob","disableExperimentalSEAWarning":true,"useSnapshot":false,"useCodeCache":false}' > dist/native/sea-config.json
          node --experimental-sea-config dist/native/sea-config.json
          cp "$(command -v node)" dist/native-release/Daisy-AI-OS-linux-x64
          npx --yes postject dist/native-release/Daisy-AI-OS-linux-x64 NODE_SEA_BLOB dist/native/aios-runtime.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x dist/native-release/Daisy-AI-OS-linux-x64
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq live-build xorriso debootstrap rsync
      - run: npm run os:build:x86
      - uses: actions/upload-artifact@v4
        with:
          name: release-amd64
          path: |
            dist/native-release/Daisy-AI-OS-linux-x64
            dist/os/Daisy-AI-OS-amd64.iso
            dist/os/Daisy-AI-OS-amd64.iso.sha256

  build-arm64-runtime:
    name: Build ARM64 runtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build ARM64 runtime
        run: |
          mkdir -p dist/native dist/native-release
          npx esbuild runtime/src/server.ts --bundle --platform=node --format=cjs --outfile=dist/native/aios-runtime.cjs
          printf '%s' '{"main":"dist/native/aios-runtime.cjs","output":"dist/native/aios-runtime.blob","disableExperimentalSEAWarning":true,"useSnapshot":false,"useCodeCache":false}' > dist/native/sea-config.json
          node --experimental-sea-config dist/native/sea-config.json
          cp "$(command -v node)" dist/native-release/Daisy-AI-OS-linux-arm64
          npx --yes postject dist/native-release/Daisy-AI-OS-linux-arm64 NODE_SEA_BLOB dist/native/aios-runtime.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x dist/native-release/Daisy-AI-OS-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-arm64-runtime
          path: dist/native-release/Daisy-AI-OS-linux-arm64

  build-arm64-image:
    name: Build ARM64 UEFI image
    needs: build-arm64-runtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-arm64-runtime
          path: dist/native-release
      - run: chmod +x dist/native-release/Daisy-AI-OS-linux-arm64
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq live-build xorriso debootstrap rsync mtools grub-efi-arm64-bin grub-common grub2-common
      - run: npm run os:build:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-arm64
          path: |
            dist/native-release/Daisy-AI-OS-linux-arm64
            dist/os/Daisy-AI-OS-arm64.iso
            dist/os/Daisy-AI-OS-arm64.iso.sha256

  package-release:
    name: Package and publish release
    needs: [build-amd64, build-arm64-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint && npm run build
      - uses: actions/download-artifact@v4
        with:
          name: release-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-arm64
          path: dist
      - name: Normalize downloaded artifact paths
        run: |
          mkdir -p dist/os dist/native-release
          find dist -type f -name '*.iso' -exec cp {} dist/os/ \;
          find dist -type f -name '*.sha256' -exec cp {} dist/os/ \;
          find dist -type f -name 'Daisy-AI-OS-linux-*' -exec cp {} dist/native-release/ \;
      - name: Create split release assets
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -cf release-assets/Daisy-AI-OS-Complete-With-ISO.tar \
            --exclude='.git' --exclude='node_modules' --exclude='.os-build' --exclude='coverage' .
          split -b 1800M -d -a 2 \
            release-assets/Daisy-AI-OS-Complete-With-ISO.tar \
            release-assets/Daisy-AI-OS-Complete-With-ISO.tar.part-
          (cd release-assets && sha256sum Daisy-AI-OS-Complete-With-ISO.tar > Daisy-AI-OS-Complete-With-ISO.tar.sha256)
          cat > release-assets/README.txt <<EOF
          Daisy AI OS ${RELEASE_TAG}

          The complete archive is split because GitHub release assets have a per-file size limit.

          Linux/macOS:
            cat Daisy-AI-OS-Complete-With-ISO.tar.part-* > Daisy-AI-OS-Complete-With-ISO.tar
            sha256sum -c Daisy-AI-OS-Complete-With-ISO.tar.sha256

          Windows PowerShell:
            cmd /c copy /b Daisy-AI-OS-Complete-With-ISO.tar.part-00+Daisy-AI-OS-Complete-With-ISO.tar.part-01 Daisy-AI-OS-Complete-With-ISO.tar
          EOF
          rm release-assets/Daisy-AI-OS-Complete-With-ISO.tar
          sha256sum -c release-assets/Daisy-AI-OS-Complete-With-ISO.tar.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Daisy AI OS ${RELEASE_TAG}" \
            --notes-file release-assets/README.txt \
            release-assets/Daisy-AI-OS-Complete-With-ISO.tar.part-* \
            release-assets/Daisy-AI-OS-Complete-With-ISO.tar.sha256 \
            release-assets/README.txt
