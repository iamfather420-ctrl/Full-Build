name: Daisy Vercel Proxy Security Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/api/DaisyVercelProxyRouter.ts"
      - "src/api/DaisyVercelProxyRouter.test.ts"
      - "src/server/apiRouter.ts"
      - "api/[...path].ts"
      - "src/api/DaisyInternalProxyRouter.ts"
      - "packages/db/src/index.ts"
      - ".github/workflows/daisy-vercel-proxy-validation.yml"

permissions:
  contents: read

concurrency:
  group: daisy-vercel-proxy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proxy-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Run proxy security tests
        run: bunx tsx --test src/api/DaisyVercelProxyRouter.test.ts
      - name: Type-check project
        run: bun run lint
