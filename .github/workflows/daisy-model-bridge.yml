name: Daisy Model Bridge and Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Daisy LOC training workflow run ID to convert
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: daisy-model-bridge
  cancel-in-progress: false

jobs:
  convert-validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      LLAMA_CPP_COMMIT: c74c71a6f7a0b06df30f979520e5d9a86a4d60ad
    steps:
      - name: Checkout this bridge commit
        uses: actions/checkout@v4

      - name: Download the exact successful training artifact
        uses: actions/download-artifact@v4
        with:
          name: daisy-loc-grammar-cpu-checkpoint
          path: artifacts/daisy-hf
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Locate and validate the Hugging Face checkpoint
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINT="$(find artifacts/daisy-hf -type f \( -name 'model.safetensors' -o -name 'pytorch_model.bin' \) -printf '%h\n' | head -n1)"
          test -n "$CHECKPOINT"
          test -s "$CHECKPOINT/config.json"
          test -s "$CHECKPOINT/tokenizer.json" || test -s "$CHECKPOINT/tokenizer_config.json"
          echo "path=$CHECKPOINT" >> "$GITHUB_OUTPUT"
          python - "$CHECKPOINT" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          cfg=json.loads((p/'config.json').read_text())
          print("Checkpoint architecture:", cfg.get("architectures"))
          print("Model type:", cfg.get("model_type"))
          if not cfg.get("architectures") or not cfg.get("model_type"):
              raise SystemExit("BLOCKED: missing model architecture metadata")
          PY

      - name: Checkout pinned llama.cpp converter and runtime
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_CPP_COMMIT }}
          path: .build/llama.cpp

      - name: Build the CPU inference executable and quantizer
        run: |
          cmake -S .build/llama.cpp -B .build/llama.cpp/build -DGGML_NATIVE=OFF -DGGML_OPENMP=ON
          cmake --build .build/llama.cpp/build --config Release --target llama-cli llama-quantize -j2

      - name: Install pinned converter dependencies
        run: python -m pip install --upgrade pip torch numpy sentencepiece protobuf transformers gguf

      - name: Convert Hugging Face checkpoint to GGUF and quantize
        env:
          HF_CHECKPOINT: ${{ steps.checkpoint.outputs.path }}
        run: |
          set -euo pipefail
          python .build/llama.cpp/convert_hf_to_gguf.py "$HF_CHECKPOINT" --outfile artifacts/daisy-model-f16.gguf --outtype f16
          .build/llama.cpp/build/bin/llama-quantize artifacts/daisy-model-f16.gguf artifacts/daisy-model.gguf Q4_K_M
          test -s artifacts/daisy-model.gguf
          rm artifacts/daisy-model-f16.gguf

      - name: Generate text through the Full-Build engine contract
        env:
          DAISY_LLAMA_CLI: ${{ github.workspace }}/.build/llama.cpp/build/bin/llama-cli
        run: |
          set -euo pipefail
          chmod +x scripts/daisy-infer.sh
          scripts/daisy-infer.sh --model artifacts/daisy-model.gguf --prompt "A noun is a word that" > artifacts/model-smoke-test.txt
          test -s artifacts/model-smoke-test.txt

      - name: Create checksum manifest
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          model=pathlib.Path("artifacts/daisy-model.gguf")
          smoke=pathlib.Path("artifacts/model-smoke-test.txt").read_text(encoding="utf-8", errors="replace").strip()
          if not smoke:
              raise SystemExit("BLOCKED: inference produced no text")
          digest=hashlib.sha256(model.read_bytes()).hexdigest()
          manifest={
            "schema":"daisy-gguf-release/v1",
            "status":"CONVERTED_AND_GENERATION_OBSERVED",
            "model_id":"HuggingFaceTB/SmolLM2-135M-Instruct",
            "source_training_run_id":os.environ["SOURCE_RUN_ID"],
            "source_training_commit":"133cd82c23563e7b13ab636ef12d117db05ccf16",
            "dataset_sha256":"79a9c60a64357713b98c90f1bffc82066f0b48cb3cc2b9e155cdd6229845a6f7",
            "llama_cpp_commit":os.environ["LLAMA_CPP_COMMIT"],
            "format":"GGUF",
            "quantization":"Q4_K_M",
            "file":"daisy-model.gguf",
            "bytes":model.stat().st_size,
            "sha256":digest,
            "generation_observed":True,
            "generation_preview":smoke[:240],
            "activation_authorized":False
          }
          pathlib.Path("artifacts/daisy-model-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps({k:manifest[k] for k in ("status","sha256","bytes","generation_observed","activation_authorized")}, indent=2))
          PY

      - name: Publish immutable model release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="daisy-model-${SOURCE_RUN_ID}"
          gh release create "$TAG" artifacts/daisy-model.gguf artifacts/daisy-model-manifest.json artifacts/model-smoke-test.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Daisy model from training run ${SOURCE_RUN_ID}" \
            --notes "Converted from the successful Full-Build LOC grammar checkpoint. GGUF Q4_K_M. SHA-256 is in the manifest. A local generation was observed. This release does not authorize production activation or payments."
