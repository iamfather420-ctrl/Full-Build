name: Daisy LOC Grammar Language Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: true
        default: "3"
      max_length:
        description: Token sequence length
        required: true
        default: "512"

permissions:
  contents: read

jobs:
  train-loc-grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Full-Build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout immutable canonical language source
        uses: actions/checkout@v4
        with:
          repository: Solvex-Paradox-Box/loc-english-grammar-source-collection
          ref: b17b18bdf9366f0e245fe1f870bc05889d344dcf
          path: .sources/loc-english-grammar-source-collection
          fetch-depth: 1
          persist-credentials: false

      - name: Require explicit source-specific training authorization
        id: source_gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/daisy_learning_pipeline.py \
            --source-root .sources/loc-english-grammar-source-collection \
            --expected-commit b17b18bdf9366f0e245fe1f870bc05889d344dcf \
            --learning-engine-gate manifests/learning-engine-gate-2026-11-27.json \
            --output artifacts/daisy-learning-pipeline/preflight.json
          python3 - <<'PY'
          import json, os
          p="artifacts/daisy-learning-pipeline/preflight.json"
          d=json.load(open(p, encoding="utf-8"))
          if d.get("training_authorized") is not True or "loc-english-grammar-six-books" not in d.get("eligible_source_ids", []):
              raise SystemExit("BLOCKED: the six-book LOC collection is not explicitly authorized for model training.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_commit={d['source_commit']}\n")
              out.write(f"source_inventory_sha256={d['source_inventory_sha256']}\n")
              out.write(f"learning_engine_gate_sha256={d['learning_engine_gate_sha256']}\n")
              out.write(f"approved_source_count={d['approved_source_count']}\n")
          print(json.dumps({k:d[k] for k in ("status","training_authorized","approved_source_count","source_commit","source_inventory_sha256","learning_engine_gate_sha256")}, indent=2))
          PY

      - name: Require an existing GPU-capable runner
        run: |
          set -euo pipefail
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "::error::BLOCKED: no GPU-capable runner is available; CPU-only model training is not permitted."
            exit 1
          fi
          nvidia-smi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/daisy-smollm2/requirements.txt

      - name: Prepare source-disjoint approved plain-text grammar corpus
        env:
          DAISY_SOURCE_ROOT: .sources/loc-english-grammar-source-collection
          DAISY_EXPECTED_SOURCE_COMMIT: b17b18bdf9366f0e245fe1f870bc05889d344dcf
          DAISY_LEARNING_ENGINE_GATE: manifests/learning-engine-gate-2026-11-27.json
        run: node scripts/prepare_loc_language_model_corpus.mjs

      - name: Install local training dependencies
        run: python -m pip install -r training/daisy-smollm2/requirements.txt

      - name: Compile and validate trainer before model download
        run: |
          python -m py_compile training/daisy-smollm2/train_text.py
          python -c "from pathlib import Path; import sys; sys.path.insert(0, 'training/daisy-smollm2'); from train_text import load_records; rows, digest = load_records(Path('artifacts/training/loc-english/language-model-corpus.jsonl')); print({'records': len(rows), 'sha256': digest})"

      - name: Train Daisy on the verified GPU runner
        env:
          DAISY_LM_TRAIN_FILE: artifacts/training/loc-english/language-model-corpus.jsonl
          DAISY_OUTPUT_DIR: artifacts/daisy-smollm2-loc-grammar
          DAISY_REQUIRE_CUDA: "true"
          DAISY_EPOCHS: ${{ inputs.epochs || '3' }}
          DAISY_MAX_LENGTH: ${{ inputs.max_length || '512' }}
          DAISY_BATCH_SIZE: "1"
          DAISY_SOURCE_ROOT: .sources/loc-english-grammar-source-collection
          DAISY_SOURCE_COMMIT: ${{ steps.source_gate.outputs.source_commit }}
          DAISY_SOURCE_INVENTORY_SHA256: ${{ steps.source_gate.outputs.source_inventory_sha256 }}
          DAISY_LEARNING_ENGINE_GATE_SHA256: ${{ steps.source_gate.outputs.learning_engine_gate_sha256 }}
          DAISY_TRAINING_AUTHORIZED: "true"
          DAISY_TRAINING_WORKFLOW_COMMIT: ${{ github.sha }}
        run: python training/daisy-smollm2/train_text.py

      - name: Upload checkpoint, metrics, and hash manifest
        uses: actions/upload-artifact@v4
        with:
          name: daisy-loc-grammar-gpu-checkpoint
          path: artifacts/daisy-smollm2-loc-grammar/
          if-no-files-found: error
          retention-days: 30
