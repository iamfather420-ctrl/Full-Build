name: Generate Bun lockfile candidate

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Resolve dependencies and regenerate lockfile candidate
        run: |
          bun install
          bun install --frozen-lockfile
      - name: Upload generated lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: bun-lockfile-candidate
          path: bun.lock
          if-no-files-found: error
          retention-days: 3
