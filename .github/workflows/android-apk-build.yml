name: Android APK Build

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The Secrets Gradle Plugin turns .env entries into Java BuildConfig
      # constants. Empty values produce invalid Java (String KEY = ;). These
      # are compile-only sentinels, never production credentials or endpoints.
      - name: Provide non-secret Android CI build defaults
        run: |
          cat > app/.env <<'ENV'
          APP_URL="https://ci.invalid"
          DAISY_INFERENCE_ENGINE="CI_NOT_CONFIGURED"
          DAISY_MODEL_ID="CI_NOT_CONFIGURED"
          DAISY_MODEL_PATH="CI_NOT_CONFIGURED"
          DAISY_MODEL_VERSION="CI_NOT_CONFIGURED"
          GEMINI_API_KEY="CI_NOT_CONFIGURED"
          NEON_DATABASE_URL="postgresql://ci.invalid/disabled"
          OIDC_CLIENT_ID="CI_NOT_CONFIGURED"
          OIDC_ISSUER_URL="https://ci.invalid"
          OPENAI_API_KEY="CI_NOT_CONFIGURED"
          SOLVEX_FLY="CI_NOT_CONFIGURED"
          SOVEREIGN_AUTH_SECRET="CI_ONLY_NOT_A_SECRET"
          ENV

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solvex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
