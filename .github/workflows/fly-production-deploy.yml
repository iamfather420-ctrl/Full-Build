name: Fly Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm deployment of the reviewed main-branch commit to Fly.io app full-build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fly-production-full-build
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed main to Fly.io
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce production-readiness release gates
        shell: bash
        run: |
          set -euo pipefail
          verdict="PRODUCTION-READY"
          if ! grep -Fq "**Release verdict: ${verdict}.**" PRODUCTION_READINESS_STATUS.md; then
            echo "::error::Production readiness status is not explicitly PRODUCTION-READY. No deployment performed."
            exit 1
          fi
          if grep -Eq '^[[:space:]]*-[[:space:]]\[ \]' docs/deployment/PRODUCTION_RELEASE_CHECKLIST.md; then
            echo "::error::Production release checklist still contains unchecked items. No deployment performed."
            exit 1
          fi
          echo "Readiness marker and release checklist passed."

      - name: Install pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # pinned action commit
        with:
          version: "0.5.10"

      - name: Deploy only the reviewed app
        run: flyctl deploy --app full-build --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.GPT_TOKEN }}

      - name: Verify deployed app readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error https://full-build.fly.dev/readyz; then
              echo
              echo "Fly app readiness endpoint returned success."
              exit 0
            fi
            echo "Readiness check attempt ${attempt}/18 did not pass yet."
            sleep 10
          done
          echo "::error::Deployment completed but /readyz did not become healthy. Treat release as failed and follow the rollback runbook."
          exit 1
